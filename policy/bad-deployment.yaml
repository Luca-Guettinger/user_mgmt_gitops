# Proof that the policies are enforced, not just present (Aufgabe 5).
#
# This Deployment breaks all three ClusterPolicies at once:
#   1. image: nginx:latest        -> disallow-latest-tag
#   2. no resources block         -> require-resources
#   3. privileged: true           -> disallow-privileged
#
# ArgoCD never sees this file - it is outside charts/ and applied by hand:
#
#   kubectl apply -f policy/bad-deployment.yaml
#
# Expected: the API server refuses the request, and Kyverno names every rule
# that failed. Nothing is created, so there is nothing to clean up.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-violation-demo
  namespace: user-mgmt-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: policy-violation-demo
  template:
    metadata:
      labels:
        app: policy-violation-demo
    spec:
      containers:
        - name: demo
          image: nginx:latest
          securityContext:
            privileged: true
