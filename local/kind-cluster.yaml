# kind cluster config — maps the two NodePorts to localhost so the apps are
# reachable in a browser. Create with:
#   kind create cluster --name teko --config kind-cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # backend NodePort  -> http://localhost:30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30300   # frontend NodePort -> http://localhost:30300
        hostPort: 30300
        protocol: TCP
