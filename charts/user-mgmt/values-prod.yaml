# Environment: prod (DigitalOcean managed cluster, fra1)
# Only the values that differ from values.yaml.
# Deployed into namespace: user-mgmt

global:
  imageTag: sha-2badbf2b306f35fe8e243f8f9fe78aac5d9058f8
  labels:
    environment: prod

backend:
  service:
    type: ClusterIP
  config:
    # Cap the JVM heap. The small nodes have ~1465Mi allocatable each and
    # the HPA may run four of these at once.
    JAVA_TOOL_OPTIONS: "-Xmx256m -XX:MaxMetaspaceSize=128m"
  resources:
    requests:
      cpu: 250m
      # Close to what the JVM really uses (~250-430Mi), so the scheduler
      # only places a pod where it actually fits.
      memory: 384Mi
    limits:
      cpu: 1000m
      memory: 640Mi
  autoscaling:
    enabled: true
    # Two replicas is the floor: it is what makes the PDB meaningful and lets
    # a rolling update happen without a gap in service.
    minReplicas: 2
    # Four is the ceiling the node pool can actually schedule.
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1
  # Keep the backend off the monitoring node. The scheduler only sees
  # requests, and Grafana, Prometheus and Argo CD use far more memory than
  # they request, so that node looks empty on paper while it is full.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: workload
                operator: NotIn
                values: [monitoring]

frontend:
  # One replica is enough: this is a school project, not an HA deployment.
  replicaCount: 1
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  config:
    # Baked into the Next.js image at build time - rebuild the image when
    # this changes.
    NEXT_PUBLIC_API_URL: https://tf.nightnode.io/backend

moduleService:
  enabled: true
  database:
    secretName: module-service-db
  # Vertical scaling (Aufgabe 6): one replica, sized so it stays stable
  # under load. That is why this component has no HPA and no PDB.
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 384Mi
  # Same reason as the backend: the mon node looks empty on paper and is not.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: workload
                operator: NotIn
                values: [monitoring]

# The database is the managed Postgres from terraform/database.tf. The Secret
# is created by hand from `terraform output` (../../SECRETS-RUNBOOK.md).
externalDatabase:
  secretName: user-mgmt-prod-db

postgres:
  enabled: false

namespaceResources:
  resourceQuota:
    enabled: true
    # Sized for the HPA at full stretch (4 backend) plus one surge pod during
    # a rolling update, with headroom.
    hard:
      requests.cpu: "2"
      requests.memory: 2560Mi
      limits.cpu: "6"
      limits.memory: 5Gi
      pods: "15"
      persistentvolumeclaims: "2"
  limitRange:
    enabled: true

networkPolicy:
  enabled: true
  monitoringNamespace: monitoring
  # The k6 Job may reach the backend Service: the load test runs against prod.
  loadTestNamespace: k6

metrics:
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true

ingress:
  enabled: true
  className: nginx
  host: tf.nightnode.io
  tls:
    enabled: true
    secretName: tf-nightnode-tls
    clusterIssuer: letsencrypt-prod

certManager:
  clusterIssuer:
    create: true
    email: martin@hoechli.net
