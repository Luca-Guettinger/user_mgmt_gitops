# Environment: prod (DigitalOcean managed cluster, fra1)
# Only the values that differ from values.yaml.
# Deployed into namespace: user-mgmt

global:
  imageTag: sha-598187d4e42157993a1f4ef8baea3347343fd7af
  labels:
    environment: prod

backend:
  service:
    type: ClusterIP
  config:
    # Cap the JVM heap. The node pool is 2x s-1vcpu-2gb with ~1465Mi
    # allocatable each, and the HPA may run three of these at once.
    JAVA_TOOL_OPTIONS: "-Xmx256m -XX:MaxMetaspaceSize=128m"
  resources:
    requests:
      cpu: 100m
      # Deliberately below what the JVM actually uses: this only reserves
      # scheduling room, and the HPA measures utilisation against it.
      # The limit below is what actually caps the container.
      memory: 224Mi
    limits:
      cpu: 500m
      memory: 640Mi
  autoscaling:
    enabled: true
    # Two replicas is the floor: it is what makes the PDB meaningful and lets
    # a rolling update happen without a gap in service.
    minReplicas: 2
    # Three is the ceiling the current two nodes can actually schedule.
    # Raising it needs a third node.
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1

frontend:
  replicaCount: 1
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  config:
    # Baked into the Next.js image at build time - rebuild the image when
    # this changes.
    NEXT_PUBLIC_API_URL: https://vsc.notenverwaltung.ch/backend

postgres:
  auth:
    # TODO: replace with a real secret (Sealed Secrets / SOPS / External Secrets).
    password: aed8e71486da7ef9ad8322c362a6279e
  persistence:
    enabled: true
    # Block storage is billed at 0.10 USD per GiB per month, 1 GiB minimum.
    size: 1Gi
    # Plain do-block-storage has reclaimPolicy Delete: removing the PVC also
    # removes the volume, so nothing keeps billing after the cluster is gone.
    # Switch to do-block-storage-retain (+ keepOnDelete: true) for real data.
    storageClass: do-block-storage
    keepOnDelete: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

namespaceResources:
  resourceQuota:
    enabled: true
    # Sized for the HPA at full stretch (3 backend) plus one surge pod during
    # a rolling update, with headroom.
    hard:
      requests.cpu: "1"
      requests.memory: 1536Mi
      limits.cpu: "4"
      limits.memory: 4Gi
      pods: "15"
      persistentvolumeclaims: "2"
  limitRange:
    enabled: true

networkPolicy:
  enabled: true

ingress:
  enabled: true
  className: nginx
  host: vsc.notenverwaltung.ch
  tls:
    enabled: true
    secretName: vsc-notenverwaltung-tls
    clusterIssuer: letsencrypt-prod

certManager:
  clusterIssuer:
    create: true
    email: martin@hoechli.net
