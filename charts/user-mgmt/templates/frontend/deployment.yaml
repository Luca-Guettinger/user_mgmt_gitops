{{- if .Values.frontend.enabled }}
{{- $ctx := dict "root" . "component" "frontend" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "user-mgmt.componentName" $ctx }}
  namespace: {{ include "user-mgmt.namespace" . }}
  labels:
    {{- include "user-mgmt.labels" $ctx | nindent 4 }}
spec:
  {{- include "user-mgmt.replicas" .Values.frontend | nindent 2 }}
  strategy:
    {{- toYaml .Values.frontend.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "user-mgmt.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "user-mgmt.labels" $ctx | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/frontend/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: frontend
          image: {{ include "user-mgmt.image" (dict "root" . "image" .Values.frontend.image) }}
          imagePullPolicy: {{ include "user-mgmt.imagePullPolicy" (dict "root" . "image" .Values.frontend.image) }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.containerPort }}
          envFrom:
            - configMapRef:
                name: {{ include "user-mgmt.componentName" $ctx }}
          {{- if .Values.frontend.probes.startup.enabled }}
          # Holds the other two probes off until the app has finished booting.
          startupProbe:
            {{- include "user-mgmt.httpProbe" (dict "probe" .Values.frontend.probes.startup "port" "http") | nindent 12 }}
          {{- end }}
          {{- if .Values.frontend.probes.readiness.enabled }}
          readinessProbe:
            {{- include "user-mgmt.httpProbe" (dict "probe" .Values.frontend.probes.readiness "port" "http") | nindent 12 }}
          {{- end }}
          {{- if .Values.frontend.probes.liveness.enabled }}
          livenessProbe:
            {{- include "user-mgmt.httpProbe" (dict "probe" .Values.frontend.probes.liveness "port" "http") | nindent 12 }}
          {{- end }}
          {{- with .Values.frontend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
