{{- if .Values.frontend.enabled }}
{{- $ctx := dict "root" . "component" "frontend" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "user-mgmt.componentName" $ctx }}
  namespace: {{ include "user-mgmt.namespace" . }}
  labels:
    {{- include "user-mgmt.labels" $ctx | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "user-mgmt.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      {{- if and (eq .Values.frontend.service.type "NodePort") .Values.frontend.service.nodePort }}
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}
{{- end }}
