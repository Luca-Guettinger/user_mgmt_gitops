{{- if .Values.networkPolicy.enabled }}
{{- $ctx := dict "root" . "component" "namespace" }}
{{- $ns := include "user-mgmt.namespace" . }}
{{- $backend := dict "root" . "component" "backend" }}
{{- $frontend := dict "root" . "component" "frontend" }}
{{- $postgres := dict "root" . "component" "postgres" }}
# Deny every inbound connection to every pod in this namespace. The policies
# below then re-open exactly the three flows the app needs. Traffic from any
# other namespace - staging reaching into production, for example - matches no
# allow rule and is dropped.
#
# Egress is deliberately not restricted: the pods need DNS and the ACME
# challenge needs to leave the cluster, and locking that down adds risk
# without adding isolation between the namespaces.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "user-mgmt.fullname" . }}-default-deny
  namespace: {{ $ns }}
  labels:
    {{- include "user-mgmt.labels" $ctx | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# The ingress controller reaches the frontend and the backend. The selector is
# empty on purpose so it also covers the short-lived cert-manager solver pods
# that appear here during a certificate renewal.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "user-mgmt.fullname" . }}-allow-ingress-controller
  namespace: {{ $ns }}
  labels:
    {{- include "user-mgmt.labels" $ctx | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
---
# Only the backend may open a connection to the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "user-mgmt.fullname" . }}-allow-backend-to-postgres
  namespace: {{ $ns }}
  labels:
    {{- include "user-mgmt.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "user-mgmt.selectorLabels" $postgres | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "user-mgmt.selectorLabels" $backend | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgres.containerPort }}
---
# Server-side rendering in the portal can call the API in-cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "user-mgmt.fullname" . }}-allow-frontend-to-backend
  namespace: {{ $ns }}
  labels:
    {{- include "user-mgmt.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "user-mgmt.selectorLabels" $backend | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "user-mgmt.selectorLabels" $frontend | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.backend.containerPort }}
{{- end }}
