# Default values for the user-mgmt chart.
# Environment overrides live in values-staging.yaml / values-prod.yaml.
# values-dev.yaml targets a local kind cluster and is not managed by ArgoCD.

nameOverride: ""
fullnameOverride: ""

# Empty means "whatever the release / ArgoCD Application targets".
namespaceOverride: ""

global:
  clusterDomain: cluster.local
  imageTag: "latest"
  imagePullPolicy: IfNotPresent
  labels: {}

# --------------------------------------------------------------------- backend
backend:
  enabled: true
  # Ignored when autoscaling.enabled is true - the HPA owns the replica count.
  replicaCount: 1
  image:
    repository: ghcr.io/luca-guettinger/user-mgmt-backend
    tag: ""              # empty -> global.imageTag
    pullPolicy: ""       # empty -> global.imagePullPolicy
  containerPort: 8080
  service:
    type: ClusterIP
    port: 8080
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      # 0 means a new pod must be Ready before an old one is taken down.
      maxUnavailable: 0
  config:
    JWT_ISSUER: user-mgmt-service
    JWT_EXPIRATION_MILLIS: "3600000"
    SPRING_JPA_HIBERNATE_DDL_AUTO: update
  secrets:
    # Must be valid Base64: the backend runs Decoders.BASE64.decode() on this
    # and hands the bytes to Keys.hmacShaKeyFor.
    JWT_SECRET: MvPBBahI529jCRYlxdT6r1Mqb9Fen/OBnZ7OdRwO9qf5pYtIe3yZxpzSHD0r1NENECGN6L2ueHBdQsNyqIxemg==
  resources:
    requests:
      cpu: 100m
      memory: 224Mi
    limits:
      cpu: 500m
      memory: 640Mi
  probes:
    # Spring Security in this app permits /actuator/health only - the
    # /readiness and /liveness sub-groups answer 403 - so both probes
    # use the same path.
    #
    # The JVM needs ~110s to boot on a 1-vCPU node. The startup probe holds
    # readiness and liveness off until it answers, so a slow boot is not
    # mistaken for a hung process and killed.
    startup:
      enabled: true
      path: /actuator/health
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      # 10 + 30x10 = up to 5 minutes to come up.
      failureThreshold: 30
    readiness:
      enabled: true
      path: /actuator/health
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      enabled: true
      path: /actuator/health
      initialDelaySeconds: 60
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    # Empty disables the memory metric.
    targetMemoryUtilizationPercentage: ""
  pdb:
    # Enable only where minReplicas >= 2. With a single replica, minAvailable 1
    # permits zero disruptions and blocks node drains.
    enabled: false
    minAvailable: 1

# -------------------------------------------------------------------- frontend
frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/luca-guettinger/auth-portal
    tag: ""
    pullPolicy: ""
  containerPort: 3000
  service:
    type: ClusterIP
    port: 3000
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  config:
    HOSTNAME: "0.0.0.0"
    PORT: "3000"
    # NEXT_PUBLIC_* is baked into the Next.js bundle at BUILD time.
    # Changing it here alone is not enough - the image must be rebuilt.
    NEXT_PUBLIC_API_URL: http://localhost:3000/backend
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  probes:
    # "/" answers 307 (redirect to /login), which counts as probe success.
    startup:
      enabled: true
      path: /
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 12
    readiness:
      enabled: true
      path: /
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      enabled: true
      path: /
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: ""
  pdb:
    enabled: false
    minAvailable: 1

# -------------------------------------------------------------------- postgres
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: ""
  containerPort: 5432
  service:
    type: ClusterIP
    port: 5432
  auth:
    username: postgres
    password: change-me
    database: userdb
  persistence:
    enabled: true
    # Empty -> cluster default StorageClass.
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 8Gi
    keepOnDelete: false
    mountPath: /var/lib/postgresql/data
    # Block storage volumes contain lost+found, which Postgres refuses to
    # initialise into, so the data directory lives one level down.
    subPath: pgdata
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  probes:
    readiness:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10
    liveness:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 20

# -------------------------------------------------- namespace-level guardrails
# ResourceQuota caps what the whole namespace may consume. LimitRange supplies
# defaults, so pods created in this namespace by other controllers - notably
# cert-manager's ACME solver, which declares no resources - still satisfy the
# quota instead of being rejected.
namespaceResources:
  resourceQuota:
    enabled: false
    hard:
      requests.cpu: "1"
      requests.memory: 1Gi
      limits.cpu: "3"
      limits.memory: 3Gi
      pods: "15"
      persistentvolumeclaims: "2"
  limitRange:
    enabled: false
    default:
      cpu: 300m
      memory: 256Mi
    defaultRequest:
      cpu: 50m
      memory: 128Mi

# Namespace isolation: default-deny on ingress, then only the flows the app
# actually needs. Traffic from any other namespace is dropped.
networkPolicy:
  enabled: false
  # Namespace the ingress controller runs in, matched on the automatic
  # kubernetes.io/metadata.name label.
  ingressNamespace: ingress-nginx

# --------------------------------------------------------------------- ingress
ingress:
  enabled: false
  className: nginx
  host: localhost
  # Requests starting with this prefix go to the backend (prefix stripped),
  # everything else goes to the frontend.
  backendPathPrefix: /backend
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Explicit round robin across the Ready endpoints of each Service.
    nginx.ingress.kubernetes.io/load-balance: round_robin
  tls:
    enabled: false
    secretName: user-mgmt-tls
    clusterIssuer: letsencrypt-prod

# ---------------------------------------------------------------- cert-manager
certManager:
  clusterIssuer:
    create: false
    name: letsencrypt-prod
    email: luca.guettinger@cmi.ch
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretName: letsencrypt-prod-account-key
