# Configuration for the kube-prometheus-stack subchart.
# Everything under the kube-prometheus-stack: key is passed to that chart.
#
# Sizing note: this cluster is DigitalOcean DOKS with small nodes, so every
# component declares requests and limits and the stack is pinned to the node
# pool labelled workload=monitoring (see the runbook).

kube-prometheus-stack:

  # ------------------------------------------------------------------ scrape
  # DOKS does not expose the control plane, so these four would be permanently
  # down and would alert forever.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false
  # Its scrape Service would be created in kube-system, which the platform
  # project does not allow. DNS metrics are not needed here.
  coreDns:
    enabled: false

  # --------------------------------------------------------------- operator
  prometheusOperator:
    # No admission webhook: it needs a cert Job and a ValidatingWebhookConfiguration,
    # which is a lot of moving parts for a two-environment cluster.
    admissionWebhooks:
      enabled: false
    tls:
      enabled: false
    nodeSelector:
      workload: monitoring
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  # ------------------------------------------------------------- prometheus
  prometheus:
    prometheusSpec:
      # Empty selectors mean "watch every namespace". Without this the operator
      # only picks up objects labelled with this release name, and the app chart
      # would have to hardcode that name.
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelector: {}
      serviceMonitorNamespaceSelector: {}
      ruleSelectorNilUsesHelmValues: false
      ruleSelector: {}
      ruleNamespaceSelector: {}
      podMonitorSelectorNilUsesHelmValues: false

      # Lets the k6 Job push its own client-side metrics in (Aufgabe 2).
      enableRemoteWriteReceiver: true

      retention: 3d
      retentionSize: 4GB

      nodeSelector:
        workload: monitoring
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 900Mi

      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: do-block-storage
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi

  # ----------------------------------------------------------- alertmanager
  alertmanager:
    alertmanagerSpec:
      replicas: 1
      nodeSelector:
        workload: monitoring
      # Lets the Discord AlertmanagerConfig below receive alerts from every
      # namespace, not only from monitoring.
      alertmanagerConfigMatcherStrategy:
        type: None
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

    # Base route: whatever the Discord route below does not take goes nowhere.
    config:
      route:
        group_by: [namespace, alertname]
        receiver: "null"
      receivers:
        - name: "null"

  # Discord route. Unlike plain Alertmanager config, an AlertmanagerConfig can
  # read the webhook URL from a Secret, so the URL never lands in Git. The
  # Secret alertmanager-discord is created by hand - see the runbook.
  extraManifests:
    - apiVersion: monitoring.coreos.com/v1alpha1
      kind: AlertmanagerConfig
      metadata:
        name: discord
      spec:
        route:
          receiver: discord
          groupBy: [namespace, alertname]
          groupWait: 30s
          groupInterval: 5m
          repeatInterval: 4h
          # Our rules are warning/critical; this also skips the always-firing
          # Watchdog and InfoInhibitor alerts (severity none).
          matchers:
            - name: severity
              matchType: "=~"
              value: warning|critical
        receivers:
          - name: discord
            discordConfigs:
              - apiURL:
                  name: alertmanager-discord
                  key: webhook-url
                sendResolved: true

  # ---------------------------------------------------------------- grafana
  grafana:
    # Our own dashboards are the deliverable; the ~30 bundled ones cost
    # ConfigMaps and sidecar memory we do not have.
    defaultDashboardsEnabled: false

    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password

    # Dashboards and the datasource are provisioned from ConfigMaps, so there
    # is no state worth a volume.
    persistence:
      enabled: false

    nodeSelector:
      workload: monitoring
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  # -------------------------------------------------------- state / exporter
  kube-state-metrics:
    nodeSelector:
      workload: monitoring
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  # DaemonSet: it must run on every node, so no nodeSelector here.
  prometheus-node-exporter:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi
